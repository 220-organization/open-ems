    <script>
      (function () {
        var light = false;
        try {
          var raw = localStorage.getItem('pf-theme');
          if (raw) {
            var parsed = JSON.parse(raw);
            var now = new Date();
            var today =
              now.getFullYear() +
              '-' +
              String(now.getMonth() + 1).padStart(2, '0') +
              '-' +
              String(now.getDate()).padStart(2, '0');
            if (parsed && parsed.date === today && parsed.theme === 'light') light = true;
            else if (parsed && parsed.date === today && parsed.theme === 'dark') light = false;
            else light = now.getHours() >= 6 && now.getHours() < 20;
          } else {
            var hour = new Date().getHours();
            light = hour >= 6 && hour < 20;
          }
        } catch (e) {
          var fallbackHour = new Date().getHours();
          light = fallbackHour >= 6 && fallbackHour < 20;
        }
        if (light) document.documentElement.classList.add('slow-net-light');
      })();
    </script>

    <div id="slow-net-notice" role="status" aria-live="polite">
      <div class="slow-net-notice__card">

    <script>
      (function () {
        var SLOW_NOTICE_DELAY_MS = 8000;
        var SLOW_RTT_MS = 1500;
        var SLOW_DOWNLINK_MBPS = 0.4;
        var COPY = {
          en: {
            loading: 'Loading…',
            message: 'Internet is slow. Please find better internet and reconnect.',
            reconnect: 'Reconnect',
          },
          uk: {
            loading: 'Завантаження…',
            message: 'Інтернет повільний. Знайдіть кращий інтернет і перепідключіться.',
            reconnect: 'Перепідключитися',
          },
          es: {
            loading: 'Cargando…',
            message: 'Internet va lento. Busque mejor internet y vuelva a conectarse.',
            reconnect: 'Reconectar',
          },
          pl: {
            loading: 'Ładowanie…',
            message: 'Internet jest wolny. Znajdź lepszy internet i połącz się ponownie.',
            reconnect: 'Połącz ponownie',
          },
          cs: {
            loading: 'Načítání…',
            message: 'Internet je pomalý. Najděte lepší připojení a připojte se znovu.',
            reconnect: 'Znovu připojit',
          },
          nl: {
            loading: 'Laden…',
            message: 'Het internet is traag. Zoek beter internet en maak opnieuw verbinding.',
            reconnect: 'Opnieuw verbinden',
          },
          bg: {
            loading: 'Зареждане…',
            message: 'Интернетът е бавен. Намерете по-добър интернет и се свържете отново.',
            reconnect: 'Свържи отново',
          },
          fr: {
            loading: 'Chargement…',
            message: 'Internet est lent. Trouvez un meilleur accès et reconnectez-vous.',
            reconnect: 'Reconnecter',
          },
          de: {
            loading: 'Wird geladen…',
            message: 'Das Internet ist langsam. Bitte finden Sie besseres Internet und verbinden Sie sich erneut.',
            reconnect: 'Neu verbinden',
          },
        };

        function lang() {
          try {
            var params = new URLSearchParams(window.location.search);
            var fromUrl = params.get('lang') || params.get('locale');
            if (fromUrl) return fromUrl.trim().toLowerCase().split('-')[0];
          } catch (e) {}
          try {
            var stored = localStorage.getItem('pf-lang');
            if (stored) return stored.trim().toLowerCase().split('-')[0];
          } catch (e) {}
          return 'uk';
        }

        function copy() {
          return COPY[lang()] || COPY.uk;
        }

        function connection() {
          return navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;
        }

        function isSlow(conn, onLine) {
          if (onLine === false) return true;
          if (!conn) return false;
          if (conn.saveData) return true;
          var type = conn.effectiveType;
          if (type === 'slow-2g' || type === '2g') return true;
          if (typeof conn.rtt === 'number' && conn.rtt >= SLOW_RTT_MS) return true;
          if (typeof conn.downlink === 'number' && conn.downlink > 0 && conn.downlink < SLOW_DOWNLINK_MBPS) return true;
          return false;
        }

        function armTimer() {
          var host = String(location.hostname || '').toLowerCase();
          return host !== 'localhost' && host !== '127.0.0.1' && host !== '::1';
        }

        var root = document.getElementById('slow-net-notice');
        if (!root) return;
        var text = root.querySelector('.slow-net-notice__text');
        var btn = root.querySelector('.slow-net-notice__retry');
        var shownSlow = false;
        var started = Date.now();

        function paintLoading() {
          var bag = copy();
          if (text) text.textContent = bag.loading;
          if (btn) btn.textContent = bag.reconnect;
        }

        function showSlow() {
          if (!document.getElementById('slow-net-notice')) return;
          if (shownSlow) return;
          shownSlow = true;
          window.__OPEN_EMS_SLOW_NET = true;
          var bag = copy();
          if (text) text.textContent = bag.message;
          if (btn) {
            btn.textContent = bag.reconnect;
            btn.hidden = false;
          }
        }

        function tick() {
          if (!document.getElementById('slow-net-notice')) return;
          if (isSlow(connection(), navigator.onLine)) showSlow();
          else if (armTimer() && Date.now() - started >= SLOW_NOTICE_DELAY_MS) showSlow();
        }

        paintLoading();
        if (btn) btn.addEventListener('click', function () { window.location.reload(); });
        tick();
        window.setInterval(tick, 500);
        window.addEventListener('offline', showSlow);
        var conn = connection();
        if (conn && conn.addEventListener) conn.addEventListener('change', tick);
      })();
    </script>

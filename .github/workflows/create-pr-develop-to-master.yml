# Create or ensure a PR from develop to master on every push to develop.
# Uses the Actions token. Optional repo secret GH_PAT overrides it when the
# org blocks Actions from opening pull requests.
name: Create PR develop → master

on:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Check for existing PR and create if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${GH_PAT}" ]; then
            export GH_TOKEN="${GH_PAT}"
            echo "::notice::Using GH_PAT"
          else
            echo "::notice::Using GITHUB_TOKEN"
          fi
          set +e
          LIST_OUT=$(gh pr list --repo "${GITHUB_REPOSITORY}" --base master --head develop --state open --json number -q '.[].number' 2>&1)
          LIST_CODE=$?
          set -e
          if [ "$LIST_CODE" -ne 0 ]; then
            echo "::error::gh pr list failed: ${LIST_OUT}"
            exit 1
          fi
          if [ -z "$LIST_OUT" ]; then
            set +e
            CREATE_OUT=$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base master \
              --head develop \
              --title "Develop → master" \
              --body "Auto-created from push to develop. Merge when ready for production." 2>&1)
            CREATE_CODE=$?
            set -e
            if [ "$CREATE_CODE" -ne 0 ]; then
              echo "::error::gh pr create failed: ${CREATE_OUT}"
              exit 1
            fi
            echo "Created new PR develop → master"
            echo "::notice::${CREATE_OUT}"
          else
            echo "Open PR already exists: #$LIST_OUT"
          fi
